# The program. Each session has a name and a list of items.
# Item fields: time (required), title (required), detail (optional),
# break: true (optional; renders the item greyed out, e.g. coffee).

- session: "Opening"
  items:
    - time: "12:30 – 12:50"
      title: "Welcome, introduction and overview of CiCS"
      detail: "Tanja Lange (TU/e). Goals of the afternoon; introduction and announcements."
    - time: "12:50 – 13:15"
      title: "Updates from the PIs"
      detail: "5 minutes each on what has happened so far: Lejla Batina (Radboud University), Herbert Bos (VU Amsterdam), Marten van Dijk (CWI), Christian Schaffner (University of Amsterdam)."

- session: "Getting to know each other"
  items:
    - time: "13:15 – 14:30"
      title: "Speed meeting"
      detail: "Short rounds of about 5 minutes in rotating pairs across institutes and career stages, each with a prompt (e.g. your research in one sentence, a problem you would like help with)."
    - time: "14:30 – 14:50"
      title: "Coffee break and quadrant voting"
      detail: "Place your notes on the posters for the interactive session."
      break: true

- session: "CiCS priorities"
  items:
    - time: "14:50 – 16:00"
      title: "Interactive session: what are the most important problems for CiCS?"
      detail: "Discussion of the quadrant posters, then small groups dig into the most promising questions."
    - time: "16:00 – 16:20"
      title: "Coffee break and networking"
      detail: "Breakouts in smaller groups to identify new connections."
      break: true
    - time: "16:20 – 16:50"
      title: "CiCS priorities: report back"
      detail: "Groups present their conclusions; agree on concrete next steps."

- session: "Working together"
  items:
    - time: "16:50 – 17:10"
      title: "What do CiCS members need to be successful?"
      detail: "Ideas for shared support, such as training (e.g. “AI Agents in Practice”) or a regular bimonthly seminar."
    - time: "17:10 – 17:20"
      title: "Announcement of the RSP"
      detail: "Call for colleagues interested in taking on a role."
    - time: "17:20 – 17:30"
      title: "Next meeting and wrap-up"
      detail: "Agree on a time window and host institute for the next meeting."
    - time: "17:30"
      title: "Drinks"
      break: true
